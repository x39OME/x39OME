<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="t d">
<title id="t">Software Engineer — Building fast, beautiful apps for web &amp; mobile</title>
<desc id="d">React · React Native · TypeScript · AI-Accelerated</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#000000"/>
    <stop offset="0.6" stop-color="#040507"/>
    <stop offset="1" stop-color="#0a0d14"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.85"/>
  </filter>
  <clipPath id="netClip"><rect x="705" y="0" width="150" height="396"/></clipPath>
  <clipPath id="browserClip"><rect x="845" y="62" width="410" height="288" rx="12"/></clipPath>
  <clipPath id="screenClip"><rect x="1163" y="48" width="148" height="312" rx="23"/></clipPath>
  <style>
    .head{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:46px;letter-spacing:-0.9px;fill:#f8fafc}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .accent{fill:#38bdf8}

    .in{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
    .d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.9s}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    .spin{transform-box:view-box;animation:spin 24s linear infinite}
    .spin.slow{animation-duration:60s}
    .spin.fast{animation-duration:14s}
    .spin.rev{animation-direction:reverse}
    @keyframes spin{to{transform:rotate(360deg)}}

    .breathe{transform-box:view-box;transform-origin:100px 396px;animation:breathe 7s ease-in-out infinite}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

    .flow{stroke-dasharray:5 7;animation:flow 1.4s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}

    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .p2{animation-delay:.4s}.p3{animation-delay:.8s}.p4{animation-delay:1.2s}.p5{animation-delay:1.6s}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

    .glow{transform-box:fill-box;transform-origin:center;animation:glow 2s ease-in-out infinite}
    .g2{animation-delay:.33s}.g3{animation-delay:.66s}
    @keyframes glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.45);opacity:1}}

    .shim{animation:shim 2.6s ease-in-out infinite}
    .s2{animation-delay:.3s}.s3{animation-delay:.6s}.s4{animation-delay:.9s}
    @keyframes shim{0%,100%{opacity:1}50%{opacity:.55}}

    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</defs>

<!-- background -->
<rect width="1584" height="396" fill="url(#bg)"/>

<!-- left ring: breathing, with a small orbiting dot -->
<g class="breathe">
  <circle cx="100" cy="396" r="260" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g class="spin rev" style="transform-origin:100px 396px">
    <circle cx="360" cy="396" r="3" fill="#7dd3fc" fill-opacity="0.8"/>
  </g>
</g>

<!-- right orbit system (drawn behind the devices) -->
<circle cx="1444" cy="110" r="280" fill="none" stroke="#38bdf8" stroke-opacity="0.14"/>
<g class="spin slow rev" style="transform-origin:1444px 110px">
  <circle cx="1444" cy="110" r="214" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="2 10" stroke-linecap="round"/>
</g>
<g class="spin" style="transform-origin:1444px 110px">
  <circle cx="1164" cy="110" r="14" fill="url(#halo)"/>
  <circle cx="1164" cy="110" r="4.5" fill="#38bdf8"/>
  <circle cx="1724" cy="110" r="3" fill="#7dd3fc" fill-opacity="0.7"/>
</g>
<g class="spin fast rev" style="transform-origin:1444px 110px">
  <circle cx="1444" cy="324" r="10" fill="url(#halo)"/>
  <circle cx="1444" cy="324" r="3" fill="#e0f2fe"/>
</g>

<!-- text -->
<text x="265" y="81" class="mono accent in d1" font-size="14" letter-spacing="1.4">SOFTWARE ENGINEER</text>
<g class="in d2">
  <text x="265" y="140" class="head">Building fast,</text>
  <text x="265" y="190" class="head">beautiful apps for</text>
  <text x="265" y="240" class="head"><tspan class="accent">web &amp; mobile.</tspan></text>
</g>
<g class="in d3">
  <rect x="265" y="277" width="28" height="2" class="accent"/>
  <text x="305" y="283" class="mono" font-size="14" fill="#c9ced6">React · React Native · TypeScript · AI-Accelerated</text>
</g>
<g class="in d4" fill="none" stroke="#9aa3af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(305 305)"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></g>
  <g transform="translate(343 305)"><rect x="3" y="4" width="18" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></g>
  <g transform="translate(381 305)"><rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></g>
  <g transform="translate(419 305)"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></g>
</g>

<!-- AI network -->
<g clip-path="url(#netClip)" class="in d5">
  <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="1">
    <line x1="699" y1="110" x2="737" y2="168"/>
    <line x1="699" y1="110" x2="755" y2="84"/>
    <line x1="715" y1="262" x2="737" y2="168"/>
    <line x1="715" y1="262" x2="749" y2="318"/>
    <line x1="737" y1="168" x2="781" y2="214"/>
    <line x1="755" y1="84" x2="789" y2="134"/>
    <line x1="749" y1="318" x2="791" y2="282"/>
    <line x1="781" y1="214" x2="789" y2="134"/>
    <line x1="781" y1="214" x2="791" y2="282"/>
  </g>
  <g stroke="#38bdf8" stroke-width="1.3" stroke-opacity="0.75" class="flow">
    <line x1="789" y1="134" x2="831" y2="140"/>
    <line x1="781" y1="214" x2="831" y2="200"/>
    <line x1="791" y1="282" x2="831" y2="262"/>
    <line x1="789" y1="134" x2="831" y2="200"/>
    <line x1="791" y1="282" x2="831" y2="200"/>
  </g>
  <g stroke="#38bdf8" stroke-width="1.6" class="flow">
    <line x1="831" y1="140" x2="855" y2="140"/>
    <line x1="831" y1="200" x2="855" y2="200"/>
    <line x1="831" y1="262" x2="855" y2="262"/>
  </g>
  <g fill="#4b5563">
    <circle cx="715" cy="262" r="3" class="pulse p1"/>
    <circle cx="755" cy="84" r="3.5" class="pulse p3"/>
    <circle cx="737" cy="168" r="3.5" class="pulse p2"/>
    <circle cx="749" cy="318" r="3.5" class="pulse p4"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="781" cy="214" r="4" class="pulse p2"/>
    <circle cx="789" cy="134" r="4" class="pulse p4"/>
    <circle cx="791" cy="282" r="4" class="pulse p5"/>
    <circle cx="831" cy="140" r="5" class="glow"/>
    <circle cx="831" cy="200" r="5" class="glow g2"/>
    <circle cx="831" cy="262" r="5" class="glow g3"/>
  </g>
</g>

<!-- browser -->
<g class="in d5">
  <rect x="845" y="62" width="410" height="288" rx="12" fill="#0c0e13" filter="url(#shadow)"/>
  <g clip-path="url(#browserClip)">
    <rect x="845" y="62" width="410" height="34" fill="#08090c"/>
    <line x1="845" y1="96" x2="1255" y2="96" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="864" cy="79" r="5" fill="#f87171"/>
    <circle cx="880" cy="79" r="5" fill="#fbbf24"/>
    <circle cx="896" cy="79" r="5" fill="#4ade80"/>
    <rect x="915" y="70" width="326" height="18" rx="6" fill="#16191f"/>

    <rect x="865" y="114" width="64" height="12" rx="6" class="accent"/>
    <rect x="1119" y="116" width="32" height="8" rx="4" fill="#2a2f39"/>
    <rect x="1161" y="116" width="32" height="8" rx="4" fill="#2a2f39"/>
    <rect x="1203" y="116" width="32" height="8" rx="4" fill="#2a2f39"/>

    <rect x="865" y="145" width="210" height="15" rx="6" fill="#e5e7eb"/>
    <rect x="865" y="169" width="150" height="15" rx="6" fill="#e5e7eb"/>
    <rect x="865" y="197" width="190" height="8" rx="4" fill="#4b5563"/>
    <rect x="865" y="220" width="86" height="24" rx="7" class="accent shim"/>

    <rect x="865" y="261" width="115" height="66" rx="9" fill="#16191f" stroke="#ffffff" stroke-opacity="0.08" class="shim s2"/>
    <rect x="992" y="261" width="115" height="66" rx="9" fill="#16191f" stroke="#ffffff" stroke-opacity="0.08" class="shim s3"/>
    <rect x="1120" y="261" width="115" height="66" rx="9" fill="#16191f" stroke="#ffffff" stroke-opacity="0.08" class="shim s4"/>
  </g>
  <rect x="845.5" y="62.5" width="409" height="287" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</g>

<!-- phone -->
<g class="in d6">
  <rect x="1155" y="40" width="164" height="328" rx="30" fill="#000000" filter="url(#shadow)"/>
  <rect x="1155.5" y="40.5" width="163" height="327" rx="29.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="1163" y="48" width="148" height="312" rx="23" fill="#0c0e13"/>
  <g clip-path="url(#screenClip)">
    <rect x="1211" y="62" width="52" height="14" rx="7" fill="#000000"/>
    <rect x="1175" y="88" width="76" height="11" rx="5.5" fill="#e5e7eb"/>
    <rect x="1175" y="111" width="124" height="60" rx="12" class="accent shim"/>

    <circle cx="1187" cy="195" r="12" fill="#2a2f39"/>
    <rect x="1207" y="187" width="74" height="7" rx="3.5" fill="#d1d5db" class="shim s2"/>
    <rect x="1207" y="199" width="51" height="6" rx="3" fill="#4b5563"/>

    <circle cx="1187" cy="231" r="12" fill="#2a2f39"/>
    <rect x="1207" y="223" width="64" height="7" rx="3.5" fill="#d1d5db" class="shim s3"/>
    <rect x="1207" y="235" width="41" height="6" rx="3" fill="#4b5563"/>

    <circle cx="1187" cy="267" r="12" fill="#2a2f39"/>
    <rect x="1207" y="259" width="69" height="7" rx="3.5" fill="#d1d5db" class="shim s4"/>
    <rect x="1207" y="271" width="46" height="6" rx="3" fill="#4b5563"/>

    <line x1="1175" y1="325" x2="1299" y2="325" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="1188" y="335" width="15" height="15" rx="5" class="accent"/>
    <rect x="1229.5" y="335" width="15" height="15" rx="5" fill="#2a2f39"/>
    <rect x="1271" y="335" width="15" height="15" rx="5" fill="#2a2f39"/>
  </g>
</g>
</svg>
